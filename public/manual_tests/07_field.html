<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jet Library Field Visualizer in JS</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1e1e1e;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
        .controls {
            margin: 15px;
        }
        button {
            padding: 8px 16px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #005999;
        }
    </style>
</head>
<body>

    <h2>Jet Library Scalar & Vector Field Visualizer</h2>
    <div class="controls">
        <button onclick="switchMode('scalar')">スカラー場 (Laplacian)</button>
        <button onclick="switchMode('vector')">ベクトル場 (Curl / 渦度)</button>
    </div>
    <canvas id="simCanvas" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const PI = Math.PI;
        const halfPI = PI / 2;
        let currentMode = 'scalar'; // 'scalar' or 'vector'

        // --- C++ の MyCustomScalarField3 に相当 ---
        function scalarLaplacian(x, y, z) {
            // C++コードの Laplacian 計算式
            return -Math.sin(x) * Math.sin(y) * Math.sin(z)
                   -Math.sin(x) * Math.sin(y) * Math.sin(z)
                   -Math.sin(x) * Math.sin(y) * Math.sin(z);
        }

        // --- C++ の MyCustomVectorField3 の Curl (回転) に相当 ---
        function vectorCurl(x, y, z) {
            return {
                x: -Math.sin(y) * Math.cos(z),
                y: -Math.sin(z) * Math.cos(x),
                z: -Math.sin(x) * Math.cos(y)
            };
        }

        function drawScalarField() {
            const cols = 50;
            const rows = 50;
            const cellWidth = canvas.width / cols;
            const cellHeight = canvas.height / rows;

            const imgData = ctx.createImageData(canvas.width, canvas.height);

            for (let j = 0; j < canvas.height; j++) {
                for (let i = 0; i < canvas.width; i++) {
                    // C++側の座標変換に対応: 0.04 * kPiD * i
                    const xCoord = 0.04 * PI * (i * (cols / canvas.width));
                    const yCoord = 0.04 * PI * (j * (rows / canvas.height));
                    const zCoord = halfPI;

                    const val = scalarLaplacian(xCoord, yCoord, zCoord);
                    
                    // 値(-3〜3程度)をカラー(0〜255)にマッピング
                    const colorVal = Math.floor(Math.min(Math.max((val + 3) / 6 * 255, 0), 255));
                    
                    const index = (j * canvas.width + i) * 4;
                    imgData.data[index]     = colorVal;        // R
                    imgData.data[index + 1] = 100;             // G
                    imgData.data[index + 2] = 255 - colorVal;  // B
                    imgData.data[index + 3] = 255;             // Alpha
                }
            }
            ctx.putImageData(imgData, 0, 0);
            
            ctx.fillStyle = "white";
            ctx.font = "16px sans-serif";
            ctx.fillText("Scalar Field (Laplacian)", 15, 30);
        }

        function drawVectorField() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cols = 20;
            const rows = 20;
            const stepX = canvas.width / cols;
            const stepY = canvas.height / rows;

            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    // C++の VectorField3, Curl のループに対応
                    const xCoord = 0.1 * PI * i;
                    const yCoord = 0.1 * PI * j;
                    const zCoord = 0.5 * halfPI;

                    const curl = vectorCurl(xCoord, yCoord, zCoord);

                    const posX = (i + 0.5) * stepX;
                    const posY = (j + 0.5) * stepY;

                    // ベクトルの矢印を描画
                    const scale = 15;
                    const endX = posX + curl.x * scale;
                    const endY = posY + curl.y * scale;

                    drawArrow(posX, posY, endX, endY, "#00ffcc");
                }
            }

            ctx.fillStyle = "white";
            ctx.font = "16px sans-serif";
            ctx.fillText("Vector Field (Curl)", 15, 30);
        }

        function drawArrow(fromX, fromY, toX, toY, color) {
            const headlen = 6;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 1.5;

            // 線を描く
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            // 矢印の頭を描く
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        function render() {
            if (currentMode === 'scalar') {
                drawScalarField();
            } else {
                drawVectorField();
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            render();
        }

        // 初期描画
        render();
    </script>
</body>
</html>
