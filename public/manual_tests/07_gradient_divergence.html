<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Divergence and Vector Field</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 1px solid #555;
            background: #000;
        }
        .legend {
            margin-top: 10px;
            font-size: 14px;
            display: flex;
            gap: 20px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            display: inline-block;
            margin-right: 5px;
            border: 1px solid #777;
        }
    </style>
</head>
<body>

    <h3>Divergence Map (Red: Source / Blue: Sink) & Vector Field</h3>
    <canvas id="simCanvas" width="600" height="600"></canvas>
    <div class="legend">
        <div><span class="color-box" style="background:blue;"></span>発散 < 0 (吸い込み)</div>
        <div><span class="color-box" style="background:red;"></span>発散 > 0 (湧き出し)</div>
        <div><span class="color-box" style="background:white; border-radius:50%;"></span>ベクトル場の流れ</div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        const scale = 10 / Math.min(width, height); // 空間のスケール

        // --- 1. ベクトル場の定義 ---
        // v(x, y) = (sin(x), sin(y))
        function vectorFieldFunc(x, y) {
            return {
                x: Math.sin(x),
                y: Math.sin(y)
            };
        }

        // --- 2. 発散（Divergence）の計算 ---
        // ∇・v = ∂vx/∂x + ∂vy/∂y
        // vx = sin(x) を微分すると cos(x)
        // vy = sin(y) を微分すると cos(y)
        // よって、発散は cos(x) + cos(y) になります。
        function divergenceFunc(x, y) {
            return Math.cos(x) + Math.cos(y);
        }

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, width, height);

            const imgData = ctx.createImageData(width, height);

            // (A) 背景として発散（Divergence）を描画
            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const x = (px - centerX) * scale;
                    const y = (py - centerY) * scale;

                    const div = divergenceFunc(x, y); // 値はだいたい -2 〜 +2
                    const intensity = Math.min(Math.abs(div) * 120, 255);
                    const index = (py * width + px) * 4;

                    if (div > 0) {
                        imgData.data[index] = intensity;     // 赤 (湧き出し)
                        imgData.data[index + 3] = 255;
                    } else {
                        imgData.data[index + 2] = intensity; // 青 (吸い込み)
                        imgData.data[index + 3] = 255;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);

            // (B) 上からベクトル場（流れ）を白い矢印で描画
            const gridSpacing = 30;
            const cols = Math.floor(width / gridSpacing);
            const rows = Math.floor(height / gridSpacing);

            for (let j = 0; j <= rows; j++) {
                for (let i = 0; i <= cols; i++) {
                    const px = i * gridSpacing;
                    const py = j * gridSpacing;

                    const x = (px - centerX) * scale;
                    const y = (py - centerY) * scale;

                    const v = vectorFieldFunc(x, y);

                    const arrowScale = 15;
                    const endX = px + v.x * arrowScale;
                    const endY = py + v.y * arrowScale;

                    drawArrow(px, py, endX, endY);
                }
            }
        }

        function drawArrow(fromX, fromY, toX, toY) {
            const headlen = 4;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fillStyle = "white";
            ctx.fill();
        }

        draw();
    </script>
</body>
</html>
