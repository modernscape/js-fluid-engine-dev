<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Jet Math Utils - 2D Interactive Interpolation</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        margin-top: 20px;
        user-select: none;
        background: #1e1e1e;
      }
      canvas {
        background: #f8f9fa;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        cursor: pointer;
      }
      .info {
        margin-top: 10px;
        color: #fff;
        font-size: 14px;
      }
      h2 {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h2>流体シミュレーション用 補間関数インタラクティブ比較（2D移動対応）</h2>
    <canvas id="simCanvas" width="700" height="600"></canvas>
    <div class="info">
      4つの制御点（f0〜f3）を**縦にも横にも**ドラッグして動かしてみてください！
    </div>

    <script type="module">
      import {
        lerp,
        catmullRom,
        monotonicCatmullRom,
      } from "/public/manual_tests/08_mathutils/mathutils.js"

      const canvas = document.getElementById("simCanvas")
      const ctx = canvas.getContext("2d")

      // 4つの制御点（初期のX・Y座標）
      const points = [
        { x: 100, y: 450, name: "f0" },
        { x: 250, y: 150, name: "f1" },
        { x: 450, y: 300, name: "f2" },
        { x: 600, y: 450, name: "f3" },
      ]

      let draggedIndex = null

      // --- マウス操作（ドラッグ＆ドロップ） ---
      canvas.addEventListener("mousedown", (e) => {
        const rect = canvas.getBoundingClientRect()
        const mouseX = e.clientX - rect.left
        const mouseY = e.clientY - rect.top

        points.forEach((p, idx) => {
          const dist = Math.hypot(p.x - mouseX, p.y - mouseY)
          if (dist < 20) {
            draggedIndex = idx
          }
        })
      })

      canvas.addEventListener("mousemove", (e) => {
        if (draggedIndex === null) return

        const rect = canvas.getBoundingClientRect()
        const mouseX = e.clientX - rect.left
        const mouseY = e.clientY - rect.top

        // X座標もY座標もマウスに合わせて更新（画面内に収める）
        points[draggedIndex].x = Math.max(
          30,
          Math.min(canvas.width - 30, mouseX),
        )
        points[draggedIndex].y = Math.max(
          30,
          Math.min(canvas.height - 30, mouseY),
        )
        draw()
      })

      window.addEventListener("mouseup", () => {
        draggedIndex = null
      })

      // --- 描画メイン処理 ---
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)

        const p0 = points[0]
        const p1 = points[1]
        const p2 = points[2]
        const p3 = points[3]

        // 1. 各補間曲線の描画（p1.x から p2.x の間を t = 0〜1 で描画）

        // ① Nearest
        drawCurve((t) => (t < 0.5 ? p1.y : p2.y), p1, p2, "#999", [2, 2])
        // ② Lerp
        drawCurve((t) => lerp(p1.y, p2.y, t), p1, p2, "#2196F3", [])
        // ③ Monotonic Catmull-Rom (緑)
        drawCurve(
          (t) => monotonicCatmullRom(p0.y, p1.y, p2.y, p3.y, t),
          p1,
          p2,
          "#4CAF50",
          [],
        )
        // ④ Catmull-Rom (赤・破線・太め)
        drawCatmullRomCurve(p0.y, p1.y, p2.y, p3.y, p1, p2)

        // 2. 制御点（f0, f1, f2, f3）の描画
        points.forEach((p) => {
          ctx.fillStyle = "#333"
          ctx.beginPath()
          ctx.arc(p.x, p.y, 8, 0, Math.PI * 2)
          ctx.fill()

          ctx.font = "bold 14px sans-serif"
          ctx.fillText(p.name, p.x - 8, p.y - 15)
        })

        drawLegend()
      }

      // 汎用カーブ描画関数（X座標も連動させる）
      function drawCurve(evalFunc, p1, p2, color, dash) {
        ctx.strokeStyle = color
        ctx.lineWidth = 2.5
        ctx.setLineDash(dash)
        ctx.beginPath()

        let first = true
        for (let t = 0; t <= 1.0; t += 0.01) {
          const val = evalFunc(t)
          const px = p1.x + t * (p2.x - p1.x) // X方向もp1からp2へ滑らかにつなぐ

          if (Number.isFinite(val)) {
            if (first) {
              ctx.moveTo(px, val)
              first = false
            } else {
              ctx.lineTo(px, val)
            }
          }
        }
        ctx.stroke()
        ctx.setLineDash([])
      }

      // 赤いCatmull-Rom専用の描画関数
      function drawCatmullRomCurve(f0, f1, f2, f3, p1, p2) {
        ctx.strokeStyle = "#E91E63"
        ctx.lineWidth = 4.0
        ctx.setLineDash([6, 4])
        ctx.beginPath()
        let first = true

        for (let t = 0; t <= 1.0; t += 0.01) {
          let val = catmullRom(f0, f1, f2, f3, t)
          const px = p1.x + t * (p2.x - p1.x)

          const clampedVal = Math.max(-100, Math.min(canvas.height + 100, val))

          if (first) {
            ctx.moveTo(px, clampedVal)
            first = false
          } else {
            ctx.lineTo(px, clampedVal)
          }
        }
        ctx.stroke()
        ctx.setLineDash([])
      }

      function drawLegend() {
        const legends = [
          { name: "Nearest", color: "#999" },
          { name: "Lerp (Linear)", color: "#2196F3" },
          { name: "Monotonic Catmull-Rom (Green)", color: "#4CAF50" },
          { name: "Catmull-Rom (Red / Overshoot)", color: "#E91E63" },
        ]
        ctx.font = "12px sans-serif"
        legends.forEach((l, i) => {
          ctx.fillStyle = l.color
          ctx.fillRect(30, 20 + i * 20, 15, 10)
          ctx.fillStyle = "#333"
          ctx.fillText(l.name, 55, 29 + i * 20)
        })
      }

      // 初期描画
      draw()
    </script>
  </body>
</html>
