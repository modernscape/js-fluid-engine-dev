<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Jet Math Utils - Interpolation Sample</title>
    <style>
      body {
        background: #1e1e1e;
        font-family: sans-serif;
        text-align: center;
        margin-top: 30px;
      }
      canvas {
        background: #f0f0f0;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .info {
        margin-top: 10px;
        color: #fff;
      }
      h2 {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h2>流体シミュレーション用補間関数 (Jet Engine) の比較</h2>
    <canvas id="simCanvas" width="600" height="400"></canvas>
    <div class="info">マウスを左右に動かすと、補間位置（t）が変化します</div>

    <script type="module">
      import { lerp, catmullRom, monotonicCatmullRom } from "./mathutils.js"

      const canvas = document.getElementById("simCanvas")
      const ctx = canvas.getContext("2d")

      // 制御点 (Control Points)
      const points = [50, 150, 300, 100] // f0, f1, f2, f3
      const xCoords = [100, 200, 400, 500]

      let cursorT = 0.5

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect()
        const mouseX = e.clientX - rect.left
        cursorT = (mouseX - xCoords[1]) / (xCoords[2] - xCoords[1])
        cursorT = Math.max(0, Math.min(1, cursorT))
        draw()
      })

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)

        // 1. 制御点の描画
        ctx.fillStyle = "#333"
        points.forEach((y, idx) => {
          ctx.beginPath()
          ctx.arc(xCoords[idx], y, 6, 0, Math.PI * 2)
          ctx.fill()
          ctx.fillText(`f${idx}`, xCoords[idx] - 4, y - 12)
        })

        // 2. 各補間曲線の描画（描画順序を赤が一番下になるように変更）

        // ③ Catmull-Rom (赤) 【最下層へ移動】
        drawCatmullRomCurve()

        // ① Nearest
        drawRobustCurve(
          (t) => (t < 0.5 ? points[1] : points[2]),
          "#999",
          [2, 2],
        )

        // ② Lerp
        drawRobustCurve((t) => lerp(points[1], points[2], t), "#2196F3", [])

        // ④ Monotonic Catmull-Rom (緑)
        drawRobustCurve(
          (t) =>
            monotonicCatmullRom(points[0], points[1], points[2], points[3], t),
          "#4CAF50",
          [],
        )

        // 3. マウス位置のプレビュー
        const currentVal = catmullRom(
          points[0],
          points[1],
          points[2],
          points[3],
          cursorT,
        )
        const currentX = xCoords[1] + cursorT * (xCoords[2] - xCoords[1])

        ctx.strokeStyle = "#FF9800"
        ctx.setLineDash([4, 4])
        ctx.beginPath()
        ctx.moveTo(currentX, 0)
        ctx.lineTo(currentX, canvas.height)
        ctx.stroke()
        ctx.setLineDash([])

        ctx.fillStyle = "#FF9800"
        ctx.beginPath()
        ctx.arc(currentX, currentVal, 8, 0, Math.PI * 2)
        ctx.fill()

        drawLegend()
      }

      // 赤いCatmull-Rom専用の描画関数（太めの破線にする）
      function drawCatmullRomCurve() {
        ctx.strokeStyle = "#E91E63"
        ctx.lineWidth = 4.0 // 太さの調整

        // --- ここで破線を指定 ([描画する長さ, 空白の長さ]) ---
        ctx.setLineDash([6, 4])

        ctx.beginPath()
        let first = true
        for (let t = 0; t <= 1.0; t += 0.01) {
          let val = catmullRom(points[0], points[1], points[2], points[3], t)
          const px = xCoords[1] + t * (xCoords[2] - xCoords[1])

          const minY = -50
          const maxY = canvas.height + 50
          const clampedVal = Math.max(minY, Math.min(maxY, val))

          if (first) {
            ctx.moveTo(px, clampedVal)
            first = false
          } else {
            ctx.lineTo(px, clampedVal)
          }
        }
        ctx.stroke()

        // ほかの描画に影響しないよう破線をリセット
        ctx.setLineDash([])
      }

      // 他の線用の汎用描画関数
      function drawRobustCurve(evalFunc, color, dash) {
        ctx.strokeStyle = color
        ctx.lineWidth = 2.0
        ctx.setLineDash(dash)
        ctx.beginPath()

        let isDrawing = false
        for (let t = 0; t <= 1.0; t += 0.01) {
          const val = evalFunc(t)
          const px = xCoords[1] + t * (xCoords[2] - xCoords[1])

          if (Number.isFinite(val)) {
            if (!isDrawing) {
              ctx.moveTo(px, val)
              isDrawing = true
            } else {
              ctx.lineTo(px, val)
            }
          } else {
            isDrawing = false
          }
        }
        ctx.stroke()
        ctx.setLineDash([])
      }

      function drawLegend() {
        const legends = [
          { name: "Nearest", color: "#999" },
          { name: "Lerp (Linear)", color: "#2196F3" },
          { name: "Catmull-Rom (Red)", color: "#E91E63" },
          { name: "Monotonic Catmull-Rom (Green)", color: "#4CAF50" },
        ]
        ctx.font = "12px sans-serif"
        legends.forEach((l, i) => {
          ctx.fillStyle = l.color
          ctx.fillRect(30, 20 + i * 20, 15, 10)
          ctx.fillStyle = "#333"
          ctx.fillText(l.name, 55, 29 + i * 20)
        })
      }

      draw()
    </script>
  </body>
</html>
