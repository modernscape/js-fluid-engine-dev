<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Manual Tests Viewer</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
      }
      header {
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0;
      }
      select {
        padding: 6px 12px;
        font-size: 14px;
        min-width: 300px;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Manual Tests</h1>
      <select id="sample-select">
        <option value="">-- テスト項目を選択してください --</option>
      </select>
    </header>

    <iframe id="sample-frame" src=""></iframe>

    <script src="main.js"></script>
  </body>
</html>
