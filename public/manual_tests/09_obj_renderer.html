<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>CPU 3D Renderer (Optimized)</title>
    <style>
      body {
        margin: 0;
        background: #1a1a1a;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: sans-serif;
      }
      canvas {
        border: 1px solid #444;
        background: #000;
      }
      .controls {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="controls">
      <input type="file" id="fileInput" accept=".obj" />
      <span id="info">bunny.obj を選択してください。</span>
    </div>

    <script>
      class TriangleMesh3 {
        constructor(vertices, indices) {
          this.vertices = new Float32Array(vertices)
          this.indices = new Uint32Array(indices)
        }
      }

      const canvas = document.getElementById("canvas")
      const ctx = canvas.getContext("2d")
      let mesh = null
      let angleY = 0

      let centerX = 0,
        centerY = 0,
        centerZ = 0
      let maxDim = 1

      function parseOBJ(text) {
        const vertices = []
        const indices = []
        const lines = text.split("\n")

        let minX = Infinity,
          minY = Infinity,
          minZ = Infinity
        let maxX = -Infinity,
          maxY = -Infinity,
          maxZ = -Infinity

        for (let line of lines) {
          const parts = line.trim().split(/\s+/)
          if (parts[0] === "v") {
            const x = parseFloat(parts[1])
            const y = parseFloat(parts[2])
            const z = parseFloat(parts[3])
            vertices.push(x, y, z)

            if (x < minX) minX = x
            if (x > maxX) maxX = x
            if (y < minY) minY = y
            if (y > maxY) maxY = y
            if (z < minZ) minZ = z
            if (z > maxZ) maxZ = z
          } else if (parts[0] === "f") {
            for (let i = 1; i <= 3; i++) {
              if (parts[i]) {
                indices.push(parseInt(parts[i].split("/")[0]) - 1)
              }
            }
          }
        }

        centerX = (minX + maxX) / 2
        centerY = (minY + maxY) / 2
        centerZ = (minZ + maxZ) / 2

        const sizeX = maxX - minX
        const sizeY = maxY - minY
        const sizeZ = maxZ - minZ
        maxDim = Math.max(sizeX, sizeY, sizeZ)

        document.getElementById("info").innerText =
          `Vertices: ${vertices.length / 3}, Faces: ${indices.length / 3}`
        return new TriangleMesh3(vertices, indices)
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)

        if (mesh) {
          const screenCx = canvas.width / 2
          const screenCy = canvas.height / 2
          const scale = (canvas.height * 0.8) / maxDim

          angleY += 0.02 // 少し回転を速く
          const cos = Math.cos(angleY)
          const sin = Math.sin(angleY)

          ctx.strokeStyle = "#00ffcc"
          ctx.lineWidth = 0.5
          ctx.beginPath()

          const v = mesh.vertices
          const ind = mesh.indices

          // 【最適化】すべての面を描画すると重いため、ステップを設けて間引く（例: i += 6 で約半分に軽減）
          // 軽快に動かしたい場合は i += 9 などに増やすとさらに軽くなります
          for (let i = 0; i < ind.length; i += 6) {
            const idx0 = ind[i] * 3
            const idx1 = ind[i + 1] * 3
            const idx2 = ind[i + 2] * 3

            // 頂点0
            let x0 = v[idx0] - centerX,
              y0 = v[idx0 + 1] - centerY,
              z0 = v[idx0 + 2] - centerZ
            let nx0 = x0 * cos - z0 * sin
            let nz0 = x0 * sin + z0 * cos + maxDim * 2.0
            let fv0 = (maxDim * 1.5) / nz0
            let p0x = screenCx + nx0 * scale * fv0
            let p0y = screenCy - y0 * scale * fv0

            // 頂点1
            let x1 = v[idx1] - centerX,
              y1 = v[idx1 + 1] - centerY,
              z1 = v[idx1 + 2] - centerZ
            let nx1 = x1 * cos - z1 * sin
            let nz1 = x1 * sin + z1 * cos + maxDim * 2.0
            let fv1 = (maxDim * 1.5) / nz1
            let p1x = screenCx + nx1 * scale * fv1
            let p1y = screenCy - y1 * scale * fv1

            // 頂点2
            let x2 = v[idx2] - centerX,
              y2 = v[idx2 + 1] - centerY,
              z2 = v[idx2 + 2] - centerZ
            let nx2 = x2 * cos - z2 * sin
            let nz2 = x2 * sin + z2 * cos + maxDim * 2.0
            let fv2 = (maxDim * 1.5) / nz2
            let p2x = screenCx + nx2 * scale * fv2
            let p2y = screenCy - y2 * scale * fv2

            ctx.moveTo(p0x, p0y)
            ctx.lineTo(p1x, p1y)
            ctx.lineTo(p2x, p2y)
            ctx.closePath()
          }
          ctx.stroke()
        } else {
          ctx.fillStyle = "#666"
          ctx.font = "16px sans-serif"
          ctx.fillText(
            "下部のボタンから .obj ファイルを選択してください",
            200,
            300,
          )
        }

        requestAnimationFrame(render)
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0]
        if (!file) return
        const reader = new FileReader()
        reader.onload = (event) => {
          mesh = parseOBJ(event.target.result)
        }
        reader.readAsText(file)
      })

      render()
    </script>
  </body>
</html>
