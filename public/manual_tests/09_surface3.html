<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Surface3 & Ray Arrow</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
      }
      p {
        margin: 0 0 10px 0;
        font-size: 13px;
        color: #aaa;
        text-align: center;
      }
      canvas {
        background: #000;
        border: 2px solid #444;
        width: 700px;
        height: 700px;
        max-width: 90vw;
        max-height: 90vw;
      }
    </style>
  </head>
  <body>
    <p>1本指 / 左ドラッグ: 始点移動<br />2本指 / 右ドラッグ: 平行移動</p>
    <canvas id="canvas" width="400" height="400"></canvas>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("canvas")
        const ctx = canvas.getContext("2d")
        const width = canvas.width
        const height = canvas.height

        class Vector3D {
          constructor(x = 0, y = 0, z = 0) {
            this.x = x
            this.y = y
            this.z = z
          }
          add(v) {
            return new Vector3D(this.x + v.x, this.y + v.y, this.z + v.z)
          }
          sub(v) {
            return new Vector3D(this.x - v.x, this.y - v.y, this.z - v.z)
          }
          scale(s) {
            return new Vector3D(this.x * s, this.y * s, this.z * s)
          }
          dot(v) {
            return this.x * v.x + this.y * v.y + this.z * v.z
          }
          normalize() {
            const len = Math.sqrt(this.dot(this))
            return len > 0 ? this.scale(1 / len) : new Vector3D()
          }
        }

        const planePoint = new Vector3D(0, 0, 0)
        const planeNormal = new Vector3D(0, 0.3, -1).normalize()

        let rayOrigin = new Vector3D(0, -1.0, -1.5)
        let rayTarget = new Vector3D(0, 0, 0)

        function project(v) {
          const scale = 170
          return {
            x: width / 2 + v.x * scale,
            y: height / 2 - v.y * scale + v.z * (scale * 0.4),
          }
        }

        // 矢印の先端を描画するヘルパー関数
        function drawArrowHead(fromX, fromY, toX, toY, color) {
          const angle = Math.atan2(toY - fromY, toX - fromX)
          ctx.save()
          ctx.translate(toX, toY)
          ctx.rotate(angle)
          ctx.fillStyle = color
          ctx.beginPath()
          ctx.moveTo(0, 0)
          ctx.lineTo(-10, -5)
          ctx.lineTo(-10, 5)
          ctx.closePath()
          ctx.fill()
          ctx.restore()
        }

        let lastTouchX = 0
        let lastTouchY = 0

        // タッチイベント
        canvas.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault()
            if (e.touches.length === 1) {
              lastTouchX = e.touches[0].clientX
              lastTouchY = e.touches[0].clientY
            } else if (e.touches.length === 2) {
              lastTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2
              lastTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2
            }
          },
          { passive: false },
        )

        canvas.addEventListener(
          "touchmove",
          (e) => {
            e.preventDefault()
            const rect = canvas.getBoundingClientRect()

            if (e.touches.length === 1) {
              const clientX = e.touches[0].clientX
              const clientY = e.touches[0].clientY
              const dx = (clientX - lastTouchX) / rect.width
              const dy = (clientY - lastTouchY) / rect.height
              rayOrigin.x += dx * 3.0
              rayOrigin.y -= dy * 3.0
              lastTouchX = clientX
              lastTouchY = clientY
            } else if (e.touches.length === 2) {
              const clientX = (e.touches[0].clientX + e.touches[1].clientX) / 2
              const clientY = (e.touches[0].clientY + e.touches[1].clientY) / 2
              const dx = (clientX - lastTouchX) / rect.width
              const dy = (clientY - lastTouchY) / rect.height
              const moveX = dx * 3.0
              const moveY = -dy * 3.0
              rayOrigin.x += moveX
              rayOrigin.y += moveY
              rayTarget.x += moveX
              rayTarget.y += moveY
              lastTouchX = clientX
              lastTouchY = clientY
            }
          },
          { passive: false },
        )

        // マウスイベント（左ドラッグ：始点移動、右ドラッグ：平行移動）
        let isMouseDown = false
        let mouseButton = 0 // 0: 左, 2: 右
        let lastMouseX = 0
        let lastMouseY = 0

        // 右クリックメニューの抑制
        canvas.addEventListener("contextmenu", (e) => {
          e.preventDefault()
        })

        canvas.addEventListener("mousedown", (e) => {
          isMouseDown = true
          mouseButton = e.button
          lastMouseX = e.clientX
          lastMouseY = e.clientY
        })

        window.addEventListener("mousemove", (e) => {
          if (!isMouseDown) return
          const rect = canvas.getBoundingClientRect()
          const clientX = e.clientX
          const clientY = e.clientY
          const dx = (clientX - lastMouseX) / rect.width
          const dy = (clientY - lastMouseY) / rect.height

          if (mouseButton === 0) {
            // 左ボタンドラッグ：始点移動
            rayOrigin.x += dx * 3.0
            rayOrigin.y -= dy * 3.0
          } else if (mouseButton === 2) {
            // 右ボタンドラッグ：平行移動
            const moveX = dx * 3.0
            const moveY = -dy * 3.0
            rayOrigin.x += moveX
            rayOrigin.y += moveY
            rayTarget.x += moveX
            rayTarget.y += moveY
          }

          lastMouseX = clientX
          lastMouseY = clientY
        })

        window.addEventListener("mouseup", () => {
          isMouseDown = false
        })

        function loop() {
          ctx.clearRect(0, 0, width, height)

          const rayDir = rayTarget.sub(rayOrigin).normalize()

          const denom = planeNormal.dot(rayDir)
          let intersection = { isIntersecting: false }

          if (Math.abs(denom) > 1e-6) {
            const p0l0 = planePoint.sub(rayOrigin)
            const t = p0l0.dot(planeNormal) / denom
            if (t >= 0) {
              const pt = rayOrigin.add(rayDir.scale(t))
              intersection = {
                isIntersecting: true,
                distance: t,
                point: pt,
                normal: planeNormal,
              }
            }
          }

          const rayStartScr = project(rayOrigin)
          const rayFarPoint = rayOrigin.add(rayDir.scale(4.0))
          const rayEndScr = project(rayFarPoint)

          // 1. レイの背面（奥側）
          if (intersection.isIntersecting) {
            const ptScr = project(intersection.point)
            ctx.strokeStyle = "#1d3557"
            ctx.lineWidth = 2
            ctx.beginPath()
            ctx.moveTo(ptScr.x, ptScr.y)
            ctx.lineTo(rayEndScr.x, rayEndScr.y)
            ctx.stroke()

            // 背面の先端にも小さな矢印
            const prevPoint = project(rayOrigin.add(rayDir.scale(3.7)))
            drawArrowHead(
              prevPoint.x,
              prevPoint.y,
              rayEndScr.x,
              rayEndScr.y,
              "#1d3557",
            )
          } else {
            // 交差していない場合の矢印
            const prevPoint = project(rayOrigin.add(rayDir.scale(3.7)))
            drawArrowHead(
              prevPoint.x,
              prevPoint.y,
              rayEndScr.x,
              rayEndScr.y,
              "#3a86ff",
            )
          }

          // 2. 半透明の平面（グリッド）
          const pTL = project(new Vector3D(-0.9, 0.9, 0))
          const pTR = project(new Vector3D(0.9, 0.9, 0))
          const pBR = project(new Vector3D(0.9, -0.9, 0))
          const pBL = project(new Vector3D(-0.9, -0.9, 0))

          ctx.fillStyle = "rgba(180, 150, 255, 0.3)"
          ctx.beginPath()
          ctx.moveTo(pTL.x, pTL.y)
          ctx.lineTo(pTR.x, pTR.y)
          ctx.lineTo(pBR.x, pBR.y)
          ctx.lineTo(pBL.x, pBL.y)
          ctx.closePath()
          ctx.fill()

          ctx.strokeStyle = "rgba(255, 255, 255, 0.3)"
          ctx.lineWidth = 1
          for (let x = -0.9; x <= 0.9; x += 0.3) {
            const s1 = project(new Vector3D(x, -0.9, 0))
            const s2 = project(new Vector3D(x, 0.9, 0))
            ctx.beginPath()
            ctx.moveTo(s1.x, s1.y)
            ctx.lineTo(s2.x, s2.y)
            ctx.stroke()
          }
          for (let y = -0.9; y <= 0.9; y += 0.3) {
            const s1 = project(new Vector3D(-0.9, y, 0))
            const s2 = project(new Vector3D(0.9, y, 0))
            ctx.beginPath()
            ctx.moveTo(s1.x, s1.y)
            ctx.lineTo(s2.x, s2.y)
            ctx.stroke()
          }

          // 3. レイの前面（手前側）
          ctx.strokeStyle = "#3a86ff"
          ctx.lineWidth = 2
          ctx.beginPath()
          ctx.moveTo(rayStartScr.x, rayStartScr.y)
          if (intersection.isIntersecting) {
            const ptScr = project(intersection.point)
            ctx.lineTo(ptScr.x, ptScr.y)
            ctx.stroke()

            // 交点の直前でレイの向きに合わせた矢印を描画
            const nearPoint = project(
              intersection.point.sub(rayDir.scale(0.15)),
            )
            drawArrowHead(nearPoint.x, nearPoint.y, ptScr.x, ptScr.y, "#3a86ff")
          } else {
            ctx.lineTo(rayEndScr.x, rayEndScr.y)
            ctx.stroke()
          }

          // 4. 交点と法線
          if (intersection.isIntersecting) {
            const ptScr = project(intersection.point)

            ctx.fillStyle = "#ff006e"
            ctx.beginPath()
            ctx.arc(ptScr.x, ptScr.y, 6, 0, Math.PI * 2)
            ctx.fill()

            const normalEnd = intersection.point.add(
              intersection.normal.scale(0.4),
            )
            const normEndScr = project(normalEnd)

            ctx.strokeStyle = "#38b000"
            ctx.lineWidth = 2
            ctx.beginPath()
            ctx.moveTo(ptScr.x, ptScr.y)
            ctx.lineTo(normEndScr.x, normEndScr.y)
            ctx.stroke()

            // 法線の先端にも小さな矢印
            const normNear = project(
              intersection.point.add(intersection.normal.scale(0.25)),
            )
            drawArrowHead(
              normNear.x,
              normNear.y,
              normEndScr.x,
              normEndScr.y,
              "#38b000",
            )

            ctx.fillStyle = "#fff"
            ctx.font = "12px monospace"
            ctx.fillText("Intersecting: true", 15, 25)
            ctx.fillText(
              `Distance: ${intersection.distance.toFixed(2)}`,
              15,
              45,
            )
          } else {
            ctx.fillStyle = "#888"
            ctx.font = "12px monospace"
            ctx.fillText("Intersecting: false", 15, 25)
          }

          requestAnimationFrame(loop)
        }

        loop()
      })
    </script>
  </body>
</html>
