<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Jet Sphere3 & Ray Full Wireframe</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
      }
      p {
        margin: 0 0 10px 0;
        font-size: 13px;
        color: #aaa;
        text-align: center;
      }
      canvas {
        background: #000;
        border: 2px solid #444;
        width: 580px;
        height: 580px;
        max-width: 90vw;
        max-height: 90vw;
      }
    </style>
  </head>
  <body>
    <p>
      1本指 / 左ドラッグ: レイの始点移動<br />2本指 / 右ドラッグ: 全体平行移動
    </p>
    <canvas id="canvas" width="400" height="400"></canvas>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("canvas")
        const ctx = canvas.getContext("2d")
        const width = canvas.width
        const height = canvas.height

        class Vector3D {
          constructor(x = 0, y = 0, z = 0) {
            this.x = x
            this.y = y
            this.z = z
          }
          add(v) {
            return new Vector3D(this.x + v.x, this.y + v.y, this.z + v.z)
          }
          sub(v) {
            return new Vector3D(this.x - v.x, this.y - v.y, this.z - v.z)
          }
          scale(s) {
            return new Vector3D(this.x * s, this.y * s, this.z * s)
          }
          dot(v) {
            return this.x * v.x + this.y * v.y + this.z * v.z
          }
          lengthSquared() {
            return this.dot(this)
          }
          normalize() {
            const len = Math.sqrt(this.dot(this))
            return len > 0 ? this.scale(1 / len) : new Vector3D()
          }
        }

        class Sphere3 {
          constructor(center, radius) {
            this.center = center
            this.radius = radius
          }

          getIntersections(rayOrigin, rayDir) {
            let intersections = []
            let r = rayOrigin.sub(this.center)
            let b = rayDir.dot(r)
            let c = r.lengthSquared() - this.radius * this.radius
            let d = b * b - c

            if (d > 0) {
              d = Math.sqrt(d)
              let t1 = -b - d
              let t2 = -b + d

              if (t1 > t2) {
                let tmp = t1
                t1 = t2
                t2 = tmp
              }

              if (t1 >= 0) {
                intersections.push({
                  distance: t1,
                  point: rayOrigin.add(rayDir.scale(t1)),
                  normal: rayOrigin
                    .add(rayDir.scale(t1))
                    .sub(this.center)
                    .normalize(),
                })
              }
              if (t2 >= 0) {
                intersections.push({
                  distance: t2,
                  point: rayOrigin.add(rayDir.scale(t2)),
                  normal: rayOrigin
                    .add(rayDir.scale(t2))
                    .sub(this.center)
                    .normalize(),
                })
              }
            }
            return intersections
          }
        }

        const sphere = new Sphere3(new Vector3D(0, 0, 0), 0.8)

        let rayOrigin = new Vector3D(0, -1.8, -1.0)
        let rayTarget = new Vector3D(0, 0, 0)

        function project(v) {
          const scale = 160
          return {
            x: width / 2 + v.x * scale,
            y: height / 2 - v.y * scale + v.z * (scale * 0.3),
          }
        }

        function drawArrowHead(fromX, fromY, toX, toY, color) {
          const angle = Math.atan2(toY - fromY, toX - fromX)
          ctx.save()
          ctx.translate(toX, toY)
          ctx.rotate(angle)
          ctx.fillStyle = color
          ctx.beginPath()
          ctx.moveTo(0, 0)
          ctx.lineTo(-10, -5)
          ctx.lineTo(-10, 5)
          ctx.closePath()
          ctx.fill()
          ctx.restore()
        }

        let lastTouchX = 0
        let lastTouchY = 0

        canvas.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault()
            if (e.touches.length === 1) {
              lastTouchX = e.touches[0].clientX
              lastTouchY = e.touches[0].clientY
            } else if (e.touches.length === 2) {
              lastTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2
              lastTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2
            }
          },
          { passive: false },
        )

        canvas.addEventListener(
          "touchmove",
          (e) => {
            e.preventDefault()
            const rect = canvas.getBoundingClientRect()

            if (e.touches.length === 1) {
              const clientX = e.touches[0].clientX
              const clientY = e.touches[0].clientY
              const dx = (clientX - lastTouchX) / rect.width
              const dy = (clientY - lastTouchY) / rect.height
              rayOrigin.x += dx * 3.0
              rayOrigin.y -= dy * 3.0
              lastTouchX = clientX
              lastTouchY = clientY
            } else if (e.touches.length === 2) {
              const clientX = (e.touches[0].clientX + e.touches[1].clientX) / 2
              const clientY = (e.touches[0].clientY + e.touches[1].clientY) / 2
              const dx = (clientX - lastTouchX) / rect.width
              const dy = (clientY - lastTouchY) / rect.height
              const moveX = dx * 3.0
              const moveY = -dy * 3.0
              rayOrigin.x += moveX
              rayOrigin.y += moveY
              rayTarget.x += moveX
              rayTarget.y += moveY
              lastTouchX = clientX
              lastTouchY = clientY
            }
          },
          { passive: false },
        )

        let isMouseDown = false
        let mouseButton = 0
        let lastMouseX = 0
        let lastMouseY = 0

        canvas.addEventListener("contextmenu", (e) => {
          e.preventDefault()
        })

        canvas.addEventListener("mousedown", (e) => {
          isMouseDown = true
          mouseButton = e.button
          lastMouseX = e.clientX
          lastMouseY = e.clientY
        })

        window.addEventListener("mousemove", (e) => {
          if (!isMouseDown) return
          const rect = canvas.getBoundingClientRect()
          const clientX = e.clientX
          const clientY = e.clientY
          const dx = (clientX - lastMouseX) / rect.width
          const dy = (clientY - lastMouseY) / rect.height

          if (mouseButton === 0) {
            rayOrigin.x += dx * 3.0
            rayOrigin.y -= dy * 3.0
          } else if (mouseButton === 2) {
            const moveX = dx * 3.0
            const moveY = -dy * 3.0
            rayOrigin.x += moveX
            rayOrigin.y += moveY
            rayTarget.x += moveX
            rayTarget.y += moveY
          }

          lastMouseX = clientX
          lastMouseY = clientY
        })

        window.addEventListener("mouseup", () => {
          isMouseDown = false
        })

        function loop() {
          ctx.clearRect(0, 0, width, height)

          const rayDir = rayTarget.sub(rayOrigin).normalize()
          const intersections = sphere.getIntersections(rayOrigin, rayDir)

          const rayStartScr = project(rayOrigin)
          const rayFarPoint = rayOrigin.add(rayDir.scale(4.0))
          const rayEndScr = project(rayFarPoint)

          if (intersections.length > 0) {
            const lastInter = intersections[intersections.length - 1]
            const ptScr = project(lastInter.point)
            ctx.strokeStyle = "#1d3557"
            ctx.lineWidth = 2
            ctx.beginPath()
            ctx.moveTo(ptScr.x, ptScr.y)
            ctx.lineTo(rayEndScr.x, rayEndScr.y)
            ctx.stroke()
          }

          const sphereScr = project(sphere.center)
          const radiusScr = sphere.radius * 160

          ctx.fillStyle = "rgba(180, 130, 255, 0.38)"
          ctx.beginPath()
          ctx.arc(sphereScr.x, sphereScr.y, radiusScr, 0, Math.PI * 2)
          ctx.fill()

          ctx.strokeStyle = "rgba(255, 255, 255, 0.3)"
          ctx.lineWidth = 1.5
          ctx.beginPath()
          ctx.arc(sphereScr.x, sphereScr.y, radiusScr, 0, Math.PI * 2)
          ctx.stroke()

          const r = sphere.radius
          ctx.strokeStyle = "rgba(255, 255, 255, 0.15)"
          ctx.lineWidth = 1

          const latSteps = 4
          for (let i = -latSteps + 1; i < latSteps; i++) {
            if (i === 0) continue
            const yOffset = (r / latSteps) * i
            const ringRadius = Math.sqrt(r * r - yOffset * yOffset)

            ctx.beginPath()
            for (let theta = 0; theta <= Math.PI * 2; theta += 0.1) {
              const wx = sphere.center.x + ringRadius * Math.cos(theta)
              const wy = sphere.center.y + yOffset
              const wz = sphere.center.z + ringRadius * Math.sin(theta)
              const scr = project(new Vector3D(wx, wy, wz))
              if (theta === 0) ctx.moveTo(scr.x, scr.y)
              else ctx.lineTo(scr.x, scr.y)
            }
            ctx.stroke()
          }

          const lonSteps = 4
          for (let j = 0; j < lonSteps; j++) {
            const angleY = (Math.PI / lonSteps) * j
            ctx.beginPath()
            for (let phi = 0; phi <= Math.PI * 2; phi += 0.1) {
              const localX = r * Math.sin(phi)
              const localY = r * Math.cos(phi)

              const wx = sphere.center.x + localX * Math.cos(angleY)
              const wy = sphere.center.y + localY
              const wz = sphere.center.z + localX * Math.sin(angleY)

              const scr = project(new Vector3D(wx, wy, wz))
              if (phi === 0) ctx.moveTo(scr.x, scr.y)
              else ctx.lineTo(scr.x, scr.y)
            }
            ctx.stroke()
          }

          if (intersections.length === 2) {
            const p1Scr = project(intersections[0].point)
            const p2Scr = project(intersections[1].point)
            ctx.strokeStyle = "#3a86ff"
            ctx.lineWidth = 1.5
            ctx.setLineDash([3, 3])
            ctx.beginPath()
            ctx.moveTo(p1Scr.x, p1Scr.y)
            ctx.lineTo(p2Scr.x, p2Scr.y)
            ctx.stroke()
            ctx.setLineDash([])
          }

          ctx.strokeStyle = "#3a86ff"
          ctx.lineWidth = 2
          ctx.beginPath()
          ctx.moveTo(rayStartScr.x, rayStartScr.y)
          if (intersections.length > 0) {
            const ptScr = project(intersections[0].point)
            ctx.lineTo(ptScr.x, ptScr.y)
            ctx.stroke()

            const nearPoint = project(
              intersections[0].point.sub(rayDir.scale(0.15)),
            )
            drawArrowHead(nearPoint.x, nearPoint.y, ptScr.x, ptScr.y, "#3a86ff")
          } else {
            ctx.lineTo(rayEndScr.x, rayEndScr.y)
            ctx.stroke()
            const prevPoint = project(rayOrigin.add(rayDir.scale(3.7)))
            drawArrowHead(
              prevPoint.x,
              prevPoint.y,
              rayEndScr.x,
              rayEndScr.y,
              "#3a86ff",
            )
          }

          if (intersections.length > 0) {
            // すべての交点に点を描画
            intersections.forEach((inter, index) => {
              const ptScr = project(inter.point)

              // 交点が2つあり、それが2つ目の点（インデックス1）なら薄くする
              if (intersections.length === 2 && index === 1) {
                ctx.fillStyle = "rgba(255, 0, 110, 0.3)" // 薄い赤 (α=0.3)
              } else {
                ctx.fillStyle = "#ff006e" // 通常の赤
              }

              ctx.beginPath()
              ctx.arc(ptScr.x, ptScr.y, 6, 0, Math.PI * 2)
              ctx.fill()
            })

            const primaryInter = intersections[0]
            const ptScr = project(primaryInter.point)
            const normalEnd = primaryInter.point.add(
              primaryInter.normal.scale(0.4),
            )
            const normEndScr = project(normalEnd)

            ctx.strokeStyle = "#38b000"
            ctx.lineWidth = 2
            ctx.beginPath()
            ctx.moveTo(ptScr.x, ptScr.y)
            ctx.lineTo(normEndScr.x, normEndScr.y)
            ctx.stroke()

            const normNear = project(
              primaryInter.point.add(primaryInter.normal.scale(0.25)),
            )
            drawArrowHead(
              normNear.x,
              normNear.y,
              normEndScr.x,
              normEndScr.y,
              "#38b000",
            )

            ctx.fillStyle = "#fff"
            ctx.font = "12px monospace"
            ctx.fillText(`Intersections: ${intersections.length}`, 15, 25)
            ctx.fillText(
              `Distance 1: ${intersections[0].distance.toFixed(2)}`,
              15,
              45,
            )
            if (intersections.length > 1) {
              ctx.fillText(
                `Distance 2: ${intersections[1].distance.toFixed(2)}`,
                15,
                65,
              )
            }
          } else {
            ctx.fillStyle = "#888"
            ctx.font = "12px monospace"
            ctx.fillText("Intersecting: false", 15, 25)
          }

          requestAnimationFrame(loop)
        }

        loop()
      })
    </script>
  </body>
</html>
