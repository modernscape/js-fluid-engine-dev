<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>SDF点群の断面表示</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #0b0b0b;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h3>SDF 3D点群（断面表示: x &le; 0）</h3>
      <p>マウスドラッグで回転させて断面を確認できます</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
      class Vector3D {
        constructor(x = 0, y = 0, z = 0) {
          this.x = x
          this.y = y
          this.z = z
        }
        sub(v) {
          return new Vector3D(this.x - v.x, this.y - v.y, this.z - v.z)
        }
        length() {
          return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z)
        }
        distanceTo(v) {
          return this.sub(v).length()
        }
      }

      class Sphere3 {
        constructor(center = new Vector3D(0, 0, 0), radius = 1.0) {
          this.center = center
          this.radius = radius
        }
        signedDistance(point) {
          return point.distanceTo(this.center) - this.radius
        }
      }

      const scene = new THREE.Scene()
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      )
      camera.position.set(3, 3, 4)

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(window.innerWidth, window.innerHeight)
      document.body.appendChild(renderer.domElement)

      const controls = new THREE.OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true

      const jetSphere = new Sphere3(new Vector3D(0, 0, 0), 1.5)

      const geometry = new THREE.BufferGeometry()
      const positions = []
      const colors = []

      const resolution = 25
      const boxSize = 3.5
      const step = boxSize / resolution

      for (let x = -boxSize / 2; x <= boxSize / 2; x += step) {
        // ★ Xが正の領域（x > 0）の点をスキップして断面を作る
        if (x > 0) continue

        for (let y = -boxSize / 2; y <= boxSize / 2; y += step) {
          for (let z = -boxSize / 2; z <= boxSize / 2; z += step) {
            const point = new Vector3D(x, y, z)
            const sd = jetSphere.signedDistance(point)

            if (sd < 0.8 && sd > -0.8) {
              positions.push(x, y, z)

              let r = 0,
                g = 0,
                b = 0
              if (sd < 0) {
                const t = Math.abs(sd) / jetSphere.radius
                r = 0.2
                g = 0.5
                b = 1.0 - t * 0.5
              } else {
                const t = sd / 1.0
                r = 1.0
                g = 0.5 - t * 0.5
                b = 0.2
              }
              colors.push(r, g, b)
            }
          }
        }
      }

      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3),
      )
      geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(colors, 3),
      )

      const material = new THREE.PointsMaterial({
        size: 0.03,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
      })

      const pointCloud = new THREE.Points(geometry, material)
      scene.add(pointCloud)

      function animate() {
        requestAnimationFrame(animate)
        controls.update()
        renderer.render(scene, camera)
      }
      animate()
    </script>
  </body>
</html>
