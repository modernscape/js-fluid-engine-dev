<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Fluid Engine Development in JS</title>
    <style>
      body {
        background: #0f172a;
        color: #f8fafc;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      canvas {
        background: #1e293b;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }
      .controls {
        margin-bottom: 20px;
      }
      select {
        padding: 8px 12px;
        background: #334155;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
      }
      /* .hide {
        opacity: 0;
      } */
      div#msg {
        width: 800px;
        margin: 5px 0;
        color: #929292;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <!-- JSから動的に <option> が挿入されます -->
      <select id="sampleSelector"></select>
    </div>

    <canvas id="simulationCanvas" width="800" height="400"></canvas>
    <div id="msg"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
